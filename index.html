<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privora - Private Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app-shell">

    <header class="topbar">
        <div>
            <h1>Privora</h1>
            <p class="subtitle">Simple private messaging</p>
        </div>
        <button id="logoutBtn" class="button button-light hidden">
            Logout
        </button>
    </header>

    <section id="authSection" class="panel auth-panel">
        <h2>Welcome to Privora</h2>
        <p class="muted">Create an account or sign in.</p>

        <form id="authForm">
            <label>Email</label>
            <input id="emailInput" type="email" required>

            <label>Password</label>
            <input id="passwordInput" type="password"
                   minlength="6" required>

            <div class="auth-actions">
                <button class="button" type="submit">Login</button>
                <button class="button button-outline"
                        type="button" id="signupBtn">
                    Create account
                </button>
            </div>
        </form>

        <p id="authMessage" class="message"></p>
    </section>

    <section id="chatSection" class="panel chat-panel hidden">

        <div class="account-row">
            <div>
                <span class="small-label">Your User ID</span>
                <code id="myUid">Loading...</code>
            </div>
            <button id="copyUidBtn"
                    class="button button-outline button-small">
                Copy ID
            </button>
        </div>

        <form id="openChatForm" class="open-chat-form">
            <div class="field-grow">
                <label>Friend's Firebase User ID</label>
                <input id="friendUidInput"
                       placeholder="Paste friend's UID" required>
            </div>
            <button class="button" type="submit">Open Chat</button>
        </form>

        <div class="chat-heading">
            <h2 id="chatTitle">Select a friend</h2>
            <p id="chatHint" class="muted">
                Enter your friend's User ID.
            </p>
        </div>

        <div id="messages" class="messages">
            <div class="empty-state">
                Your messages will appear here.
            </div>
        </div>

        <form id="sendForm" class="send-form">
            <input id="messageInput"
                   type="text"
                   maxlength="2000"
                   placeholder="Type your message..."
                   disabled>

            <button id="sendBtn" class="button"
                    type="submit" disabled>
                Send
            </button>
        </form>

        <p id="chatMessage" class="message"></p>

    </section>

    <footer class="footer">
        Privora - Private Messaging
    </footer>

</main>

<script type="module" src="script.js"></script>
</body>
</html>
